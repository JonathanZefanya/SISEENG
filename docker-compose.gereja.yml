# =========================================================
# Setup lengkap (Apache + PHP + MySQL + phpMyAdmin)
# Untuk komputer gereja yang belum punya MySQL.
#
# Cara pakai:
#   docker compose -f docker-compose.gereja.yml up -d --build
#
# Nama database, user & password dikirim ke web lewat env
# (DB_NAME, DB_USER, DB_PASS). Nilainya HARUS sama dengan MYSQL_*
# di service db.
#
# Database otomatis dibuat & diisi dari database/deploy.sql
# HANYA saat pertama kali dijalankan (volume db_data masih kosong).
# =========================================================
name: siseeng-gereja

services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      # Mount di sub-path agar RewriteBase /siseeng/public/ tetap valid
      - ./:/var/www/html/siseeng
    environment:
      APP_URL: http://localhost:8080/siseeng
      DB_HOST: db
      # Harus sama dengan MYSQL_DATABASE & MYSQL_ROOT_PASSWORD di service db
      DB_NAME: db_siseeng
      DB_USER: root
      DB_PASS: root
      TZ: Asia/Jakarta
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      # Samakan dengan DB_NAME & DB_PASS di service web (DB_USER = root)
      MYSQL_DATABASE: db_siseeng
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Jakarta
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
      - ./database/deploy.sql:/docker-entrypoint-initdb.d/01-deploy.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      UPLOAD_LIMIT: 64M
    depends_on:
      - db

volumes:
  db_data:
